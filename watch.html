<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAMREXA HOA Watch</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="tracking.js"></script>
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html"><img src="brand/camrexa-logo.png" alt="CAMREXA" /></a>
  </header>
  <main class="prose">
    <p class="kicker">Free follow-on</p>
    <h1>HOA Watch™</h1>
    <p>After the Health Check, stay on the list for that building. We send a note when a public assessment, inspection, or filing changes the picture.</p>
    <form class="card form" action="mailto:chad@chadmiller.com?subject=CAMREXA%20HOA%20Watch" method="post" enctype="text/plain">
      <label>Building</label>
      <input name="building" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <button type="submit">Add me to Watch</button>
    </form>
  </main>
</body>
</html>
